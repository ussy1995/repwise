name: repwise
description: "A Hevy-style workout tracker with smart progression."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Splash
  flutter_native_splash: ^2.4.6

  # Firebase & Auth
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # State & routing
  go_router: ^14.8.1
  provider: ^6.1.5

  # Local storage (onboarding flag)
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#01696F"
  color_dark: "#171614"
  android_12:
    color: "#01696F"
    color_dark: "#171614"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/images/
